name: Documentation

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path="lib/TimestepperTheory")]); Pkg.instantiate()'
      - name: Build documentation and manuscript example
        run: julia --color=yes --project=docs docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build
